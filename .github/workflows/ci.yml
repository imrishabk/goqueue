name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: distqueue
          POSTGRES_PASSWORD: distqueue
          POSTGRES_DB: distqueue
        ports:
          - 5462:5432
        options: >-
          --health-cmd="pg_isready -U distqueue -d distqueue"
          --health-interval=5s --health-timeout=2s --health-retries=5
    env:
      DATABASE_URL: postgres://distqueue:distqueue@localhost:5462/distqueue?sslmode=disable
      DATABASE_URL_2: postgres://distqueue:distqueue@localhost:5462/distqueue2?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: create second shard DB
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE distqueue2;'
      - name: migrate all shards (also exercises the multi-DB loop)
        run: SHARD_DATABASE_URLS="$DATABASE_URL,$DATABASE_URL_2" go run ./executor/migration/migration.go up
      - name: integration tests (packages share DBs, so -p 1)
        run: go test -p 1 -tags integration ./internal/store/ ./internal/shard/ -v
